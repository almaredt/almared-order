plugins {
    id 'com.android.application'
}

android {
    namespace 'com.almared.orderlist'
    compileSdk 35

    defaultConfig {
        applicationId "com.almared.orderlist"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "1.3"
    }

    // Release signing: set these 4 environment variables (or GitHub secrets) to sign with your own key.
    // Without them the release APK is signed with the debug key, which is fine for installing on your own phones.
    signingConfigs {
        release {
            def ks = System.getenv("KEYSTORE_FILE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("KEYSTORE_FILE") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
